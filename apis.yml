aid: flatiron-health
name: Flatiron Health
description: >-
  Flatiron Health is a healthcare technology company focused on oncology,
  combining real-world data from millions of cancer patients with software and AI
  to support life sciences research and clinical care. Its platforms include
  OncoEMR and OncoCloud for oncology practices, Flatiron Vessel (clinical research
  EDC, formerly Protocol First) and Clinical Pipe for clinical trials, and
  real-world evidence products for life sciences. Flatiron data has informed
  thousands of peer-reviewed publications and regulatory submissions. The company
  is part of Roche.
